name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 8 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase aufrufen
        run: |
          curl -f "${{ secrets.SUPABASE_URL }}/rest/v1/anmeldungen?select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
